# Single-VM deployment (Oracle Cloud Always Free, Ampere A1, Ubuntu).
# Only Caddy is exposed (80/443). Services talk to each other on the internal network.
# Public URLs are path-based on one domain, e.g. https://$DOMAIN/safety -> safety:3002.
#
# Configure in backend/.env (never commit it):
#   DOMAIN=your.domain.example
#   ALLOWED_ORIGINS=https://safenight.netlify.app
#   ...the same secrets the Render services use (Supabase, Stripe, OpenAI, ...)

x-healthcheck: &node-health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 60s

services:
  caddy:
    image: caddy:2
    container_name: safenight-caddy
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - safety
      - user
      - subscription
      - geocode
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in backend/.env}/safenight-gateway:${TAG:-latest}
    container_name: safenight-gateway
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck: *node-health

  safety:
    build:
      context: .
      dockerfile: Dockerfile.safety
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in backend/.env}/safenight-safety:${TAG:-latest}
    container_name: safenight-safety
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - PORT=3002
      - NODE_ENV=production
      # Route data is read from the local OSM service first, over the internal network
      - OSM_INGESTION_URL=http://osm-ingestion:3006
      - SAFE_ROUTES_CACHE_DIR=/app/cache
    volumes:
      - safety-cache:/app/cache
    restart: unless-stopped
    healthcheck: *node-health

  user:
    build:
      context: .
      dockerfile: Dockerfile.user
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in backend/.env}/safenight-user:${TAG:-latest}
    container_name: safenight-user
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - PORT=3003
      - NODE_ENV=production
      - SUBSCRIPTION_SERVICE_URL=http://subscription:3004
    restart: unless-stopped
    healthcheck: *node-health

  subscription:
    build:
      context: .
      dockerfile: Dockerfile.subscription
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in backend/.env}/safenight-subscription:${TAG:-latest}
    container_name: safenight-subscription
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - PORT=3004
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck: *node-health

  geocode:
    build:
      context: .
      dockerfile: Dockerfile.geocode
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in backend/.env}/safenight-geocode:${TAG:-latest}
    container_name: safenight-geocode
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - PORT=3005
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck: *node-health

  osm-ingestion:
    build:
      context: .
      dockerfile: Dockerfile.osm-ingestion
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in backend/.env}/safenight-osm-ingestion:${TAG:-latest}
    container_name: safenight-osm-ingestion
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - PORT=3006
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - osm-data:/app/data
    restart: unless-stopped
    healthcheck: *node-health

volumes:
  osm-data:
  safety-cache:
  caddy-data:
  caddy-config:
